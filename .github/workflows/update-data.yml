name: Auto-Update Financial Data

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Update financial data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > update-data.js << 'EOF'
          const fs = require('fs');
          
          async function updateData() {
            console.log('🔄 מעדכן נתונים פיננסיים...');
            
            let html = fs.readFileSync('magen-kessef.html', 'utf8');
            
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'anthropic-version': '2023-06-01',
                'x-api-key': process.env.ANTHROPIC_API_KEY
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 2000,
                tools: [{
                  type: 'web_search_20250305',
                  name: 'web_search'
                }],
                messages: [{
                  role: 'user',
                  content: `חפש ברשת את הנתונים העדכניים הבאים (מהיום ${new Date().toISOString().split('T')[0]}):
          
          1. S&P 500 - YTD (מתחילת 2026) באחוזים
          2. ת"א 35 - YTD באחוזים
          3. נאסד"ק 100 - YTD באחוזים
          4. Bitcoin - מחיר נוכחי בדולר
          5. Ethereum - מחיר נוכחי בדולר
          6. דולר/שקל - שער נוכחי
          7. זהב - מחיר לאונקיה
          8. ריבית בנק ישראל - אחוז נוכחי
          
          החזר רק JSON בפורמט:
          {
            "sp500_ytd": מספר,
            "ta35_ytd": מספר,
            "nasdaq_ytd": מספר,
            "btc": מספר,
            "eth": מספר,
            "usd_ils": מספר,
            "gold": מספר,
            "boi_rate": מספר
          }
          
          ענה רק JSON, בלי הסברים.`
                }]
              })
            });
            
            const data = await response.json();
            let jsonData = '';
            
            for (const block of data.content) {
              if (block.type === 'text') {
                jsonData += block.text;
              }
            }
            
            jsonData = jsonData.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
            const numbers = JSON.parse(jsonData);
            
            console.log('📊 נתונים שהתקבלו:', numbers);
            
            html = html.replace(
              /"S&P 500":\s*{[^}]*ytd:\s*-?[\d.]+/,
              `"S&P 500": {ic:"🇺🇸",cat:"מניות עולמי",ytd:${numbers.sp500_ytd}`
            );
            
            html = html.replace(
              /text:"S&P 500 — 2026 YTD",val:"[^"]+"/,
              `text:"S&P 500 — 2026 YTD",val:"${numbers.sp500_ytd > 0 ? '+' : ''}${numbers.sp500_ytd}%"`
            );
            
            html = html.replace(
              /text:'ת"א 35 — שינוי שנתי',val:"[^"]+"/,
              `text:'ת"א 35 — שינוי שנתי',val:"${numbers.ta35_ytd > 0 ? '+' : ''}${numbers.ta35_ytd}%"`
            );
            
            html = html.replace(
              /text:"Bitcoin — מחיר עדכני",val:"\$[\d,]+"/,
              `text:"Bitcoin — מחיר עדכני",val:"$${Math.round(numbers.btc).toLocaleString()}"`
            );
            
            html = html.replace(
              /text:"Ethereum — מחיר עדכני",val:"\$[\d,]+"/,
              `text:"Ethereum — מחיר עדכני",val:"$${Math.round(numbers.eth).toLocaleString()}"`
            );
            
            html = html.replace(
              /text:"דולר-שקל",val:"₪[\d.]+"/,
              `text:"דולר-שקל",val:"₪${numbers.usd_ils.toFixed(2)}"`
            );
            
            html = html.replace(
              /text:"זהב — מחיר לאונקיה",val:"\$[\d,]+"/,
              `text:"זהב — מחיר לאונקיה",val:"$${Math.round(numbers.gold).toLocaleString()}"`
            );
            
            html = html.replace(
              /text:"ריבית בנק ישראל",val:"[\d.]+%"/,
              `text:"ריבית בנק ישראל",val:"${numbers.boi_rate}%"`
            );
            
            fs.writeFileSync('magen-kessef.html', html);
            
            console.log('✅ הנתונים עודכנו בהצלחה!');
            console.log(`📅 עודכן ב-${new Date().toLocaleString('he-IL')}`);
          }
          
          updateData().catch(console.error);
          EOF
          
          node update-data.js
      
      - name: Commit and push if changed
        run: |
          git config user.name "Auto Update Bot"
          git config user.email "bot@magen-kessef.com"
          git add magen-kessef.html
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update: Financial data $(date +'%Y-%m-%d %H:%M')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          fi
